      <text x="265.5" y="442" text-anchor="middle">Gemini</text>
      <rect x="340" y="414" width="145" height="44" rx="22" fill="#142b36" stroke="#2b4653"/>
      <text x="412.5" y="442" text-anchor="middle">Anthropic</text>
      <rect x="497" y="414" width="156" height="44" rx="22" fill="#142b36" stroke="#2b4653"/>
      <text x="575" y="442" text-anchor="middle">OpenRouter</text>
    </g>
  </g>
  <g fill="none" stroke="#37616c" stroke-width="3">
    <path d="M805 173h39c32 0 24 93 56 93h20"/>
