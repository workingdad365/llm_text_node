<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540" role="img" aria-labelledby="title desc">
  <title id="title">LLM Text for ComfyUI</title>
  <desc id="desc">Text generation for ComfyUI with OpenAI, Gemini, Anthropic, and OpenRouter.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101f2b"/>
      <stop offset="1" stop-color="#090f17"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#45e0c0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#45e0c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a4c3d1" opacity=".12"/>
    </pattern>
  </defs>
  <path fill="url(#bg)" d="M0 0h1260v540H0z"/>
  <path fill="url(#grid)" d="M0 0h1260v540H0z"/>
  <ellipse cx="1000" cy="240" rx="360" ry="330" fill="url(#glow)"/>
  <path d="M64 70h30" stroke="#64efd0" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="108" y="76" font-size="16" font-weight="600" letter-spacing="3" fill="#91b2c1">FOR COMFYUI</text>
    <text x="60" y="231" font-size="108" font-weight="700" letter-spacing="-5" fill="#f0f7fa">LLM <tspan fill="#64efd0">Text</tspan></text>
    <text x="66" y="293" font-size="29" fill="#c1d1da">Your words. Your models. Your workflow.</text>
    <text x="66" y="337" font-size="19" fill="#829eae">Generate, translate, summarize, and build better prompts.</text>
    <g font-size="17" font-weight="600" fill="#dce9ef">
